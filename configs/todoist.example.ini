[todoist]
api_base = https://api.todoist.com/api/v1
timeout_seconds = 30
max_retries = 2
page_size = 100

[vault]
# Executable and arguments are configured per machine/profile.
command = python
script = C:/path/to/skillKeePassVault/scripts/keepass_vault.py
config = C:/path/to/keepass-profile.ini
entry_path = APIs/Todoist
field = password
auth_json = {"mode":"windows_credential_manager","target":"Akuma/KeePassXC/KeeVault"}

